name: Build and deploy Node.js app to Azure Web App - AnnieSmithWebsite

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '24.x'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NODE_ENV: production

      - name: Prepare Azure deployment package
        run: |
          # Create deployment directory
          mkdir -p deployment
          
          # 1. Copy standalone files to root
          cp -r .next/standalone/* deployment/
          
          # 2. Ensure node_modules is properly copied
          rm -rf deployment/node_modules 2>/dev/null || true
          cp -r .next/standalone/node_modules deployment/
          
          # 3. Copy static folder
          mkdir -p deployment/.next
          cp -r .next/static deployment/.next/
          
          # 4. Copy public folder
          cp -r public deployment/ 2>/dev/null || true
          
          # 5. Create startup.sh for Azure
          cat > deployment/startup.sh << 'EOF'
          #!/bin/bash
          cd /home/site/wwwroot
          export PORT=8080
          export HOST=0.0.0.0
          export NODE_ENV=production
          echo "Starting Next.js on Azure - $(date)"
          exec node server.js
          EOF
          chmod +x deployment/startup.sh
          
          echo "Deployment package ready"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: azure-deployment
          path: deployment/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: Production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: azure-deployment

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'AnnieSmithWebsite'
          slot-name: 'Production'
          package: .
          startup-command: './startup.sh'
